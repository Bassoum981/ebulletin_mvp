spring.application.name=ebulletin_mvp
server.port=8080

# ==========================================
# 1. CONNEXION À LA BASE DE DONNÉES MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/ebulletinMVP_DB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. CONFIGURATION JPA / HIBERNATE
# ==========================================
# 'update' demande à Hibernate de créer ou modifier les tables automatiquement d'après tes classes Java
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans la console (très formateur pour voir ce que fait Java en sous-marin)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Précise le dialecte de la base de données
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

